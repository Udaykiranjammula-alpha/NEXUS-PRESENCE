events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream backend_api {
        server nexus-backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static frontend
        location / {
            root /usr/share/nginx/html/frontend;
            index index.html dashboard.html;
            try_files $uri $uri/ /index.html;
        }

        # Serve 3D visualization assets
        location /visualization/ {
            alias /usr/share/nginx/html/visualization/;
        }

        # Proxy REST API requests
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy WebSocket Telemetry Stream
        location /ws/ {
            proxy_pass http://backend_api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
